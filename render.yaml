services:
  - type: web
    name: sentinel-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SENTINEL_DB_PATH
        value: data/sentinel.db
      - key: SENTINEL_CORS_ORIGINS
        sync: false
